[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdnkit"
version = "0.1.0"
description = "Fractional Dynamical Network & Multifractal toolkit for intracranial EEG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Samir Hossain" },
]
keywords = [
    "iEEG",
    "EEG",
    "DFA",
    "MFDFA",
    "multifractal",
    "fractional dynamics",
    "network physiology",
    "neuroscience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
io = ["mne>=1.0", "h5py>=3.0"]
all = ["matplotlib>=3.5", "mne>=1.0", "h5py>=3.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.5",
    "h5py>=3.0",
    "ruff>=0.1",
]

[project.scripts]
fdnkit = "fdnkit.cli:main"

[project.urls]
Homepage = "https://github.com/SamirHossain099/fdnkit"
Documentation = "https://github.com/SamirHossain099/fdnkit#readme"
Repository = "https://github.com/SamirHossain099/fdnkit"
Issues = "https://github.com/SamirHossain099/fdnkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fdnkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B905"]
